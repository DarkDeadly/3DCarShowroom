<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/css/styles.css">
    <link rel="stylesheet" href="/src/assets/css/auth.css">
    <title>CarSphere</title>
</head>

<body>
    <div>
        <nav>
            <!-- Brand -->
            <a class="navbar-brand" href="#">
                <img src="/src/assets/Screenshot from 2026-06-10 20-14-50.png" alt="CarSphere logo">
                <span class="brand-name">Car<span class="accent">Sphere</span></span>
            </a>

            <!-- Nav links -->
            <ul class="nav-links">
                <li><a href="authentication.html" class="active">Home</a></li>
                <li><a href="index.html">Cars</a></li>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Reports</a></li>
            </ul>

            <!-- Auth buttons -->
            <div class="nav-actions">
                <button class="btn-login">Login</button>
                <button class="btn-register">Register</button>
            </div>
        </nav>
        <main class="auth-container">
            <div class="auth-card">

                <div class="auth-header">
                    <h1 class="auth-title" id="auth-form-title">Welcome Back</h1>
                    <p class="auth-subtitle" id="auth-form-subtitle">Enter your credentials to access your CarSphere
                        showroom.</p>
                </div>

                <div class="social-auth-block">
                    <button type="button" class="btn-google-auth">
                        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4" />
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853" />
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                                fill="#FBBC05" />
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335" />
                        </svg>
                        <span>Continue with Google</span>
                    </button>
                </div>

                <div class="auth-divider">
                    <span>or use email</span>
                </div>

                <form id="auth-form" autocomplete="off">
                    <div id="auth-feedback" class="auth-feedback d-none"></div>
                    <div class="form-group d-none" id="username-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-wrapper">
                            <input type="text" id="username" class="form-control" placeholder="e.g., speedster23" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" class="form-control" placeholder="name@example.com"
                                required />
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="password" class="form-label">Password</label>
                            <a href="#" class="forgot-password-link" id="forgot-pass-anchor">Forgot?</a>
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="password" class="form-control" placeholder="••••••••••••"
                                required />
                        </div>
                    </div>

                    <button type="submit" class="btn-auth-submit" id="submit-btn-text">Sign In</button>
                </form>

                <div class="auth-card-footer">
                    <p class="toggle-text">
                        <span id="toggle-switch-prompt">Don't have an account?</span>
                        <a href="#" id="auth-toggle-trigger">Create one</a>
                    </p>
                </div>

            </div>
        </main>
    </div>
    <script type="module" src="/src/Js/auth.js"></script>
    <script type="module" src="/src/Js/uiChanges.js"></script>
</body>

</html>
