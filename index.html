<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/src/assets/css/styles.css">
  <title>CarSphere</title>
</head>

<body>
  <div id="app">

    <nav>
      <!-- Brand -->
      <a class="navbar-brand" href="#">
        <img src="/src/assets/Screenshot from 2026-06-10 20-14-50.png" alt="CarSphere logo">
        <span class="brand-name">Car<span class="accent">Sphere</span></span>
      </a>

      <!-- Nav links -->
      <ul class="nav-links">
        <li><a href="authentication.html">Home</a></li>
        <li><a href="index.html" class="active">Cars</a></li>
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Reports</a></li>
      </ul>

      <!-- Auth buttons -->
      <div class="nav-actions">
        <button class="btn-login">Login</button>
        <button class="btn-register">Register</button>
      </div>
    </nav>
    <main>
      <div class="search__cars">
        <div class="control-deck">

          <div class="search-field">
            <svg class="search-field__icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input type="text" id="carSearchInput" class="search-field__input"
              placeholder="Search by vehicle name, model, brand or keywords...">
          </div>

          <div class="filter-dropdown">
            <select id="brandSortSelect" class="filter-dropdown__select">

            </select>
          </div>

          <button class="btn-add-car" id="openAddModalBtn" style="display: none;">
            <svg class="btn-add-car__icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5v14" />
            </svg>
            <span>List a Vehicle</span>
          </button>

        </div>
      </div>
      <div class="car__container">
        <aside>

        </aside>
        <div class="car__content">

        </div>
      </div>
    </main>

  </div>
  <dialog id="addCarModal" class="modal-window">
    <div class="modal-card">

      <div class="modal-header">
        <div class="modal-header__text">
          <h2 class="modal-title">List New Vehicle</h2>
          <p class="modal-subtitle">Register a premium automotive asset to the CarSphere ecosystem.</p>
        </div>
        <button id="closeAddModalBtn" class="modal-close-btn" aria-label="Close form Window">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="addVehicleForm" autocomplete="off">

        <div class="form-row columns-2">
          <div class="form-group">
            <label for="car-brand" class="form-label">Brand</label>
            <input type="text" id="car-brand" class="form-control" placeholder="e.g., BMW, Porsche, Ford" required />
          </div>
          <div class="form-group">
            <label for="car-name" class="form-label">Model Name</label>
            <input type="text" id="car-name" class="form-control" placeholder="e.g., M4 Competition" required />
          </div>
        </div>

        <div class="form-row columns-2">
          <div class="form-group">
            <label for="car-hp" class="form-label">Horsepower</label>
            <input type="text" id="car-hp" class="form-control" placeholder="e.g., 503 hp" required />
          </div>
          <div class="form-group">
            <label for="car-transmission" class="form-label">Transmission Unit</label>
            <input type="text" id="car-transmission" class="form-control" placeholder="e.g., 8-speed Automatic"
              required />
          </div>
        </div>

        <div class="form-group">
          <label for="car-price" class="form-label">Market Valuation Price (DT)</label>
          <div class="price-input-wrapper">
            <input type="number" id="car-price" class="form-control price-field" placeholder="e.g., 85000" min="1"
              required />
            <span class="currency-badge">DT</span>
          </div>
        </div>
        <div class="form-group">
          <label for="car-image" class="form-label">Asset Image File</label>
          <div class="simple-upload-field">
            <label class="btn-file-select" for="car-image">Choose File</label>
            <span class="file-status-text" id="fileStatusText">No file selected</span>
            <input type="file" id="car-image" accept="image/*" required style="display: none;" />
          </div>
        </div>

        <div class="modal-actions-tray">
          <button type="button" id="cancelAddModalBtn" class="btn-modal-secondary">Cancel</button>
          <button type="submit" class="btn-modal-primary">Publish Vehicle Listing</button>
        </div>

      </form>

    </div>
  </dialog>
  <script type="module" src="/src/Js/main.js"></script>
  <script type="module" src="/src/config/firebase.js"></script>
  <script type="module" src="/src/Js/uiChanges.js"></script>

</body>

</html>
